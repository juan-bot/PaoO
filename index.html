<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Para Ti ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      max-width: 700px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      color: #ff4d6d;
      font-size: 2.5rem;
    }

    p {
      margin-bottom: 30px;
      color: #666;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .btn {
      text-decoration: none;
      padding: 18px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      background: #ff4d6d;
      color: white;
      transition: 0.3s;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }

    .btn:hover {
      transform: translateY(-4px);
      background: #ff2e55;
      box-shadow: 0 12px 20px rgba(0,0,0,0.25);
    }

    footer {
      margin-top: 25px;
      font-size: 14px;
      color: #999;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
      50%       { transform: scale(1.04); box-shadow: 0 12px 28px rgba(255,77,141,0.45); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Para Ti Preciosa ❤️</h1>
    <p>Que quieres ver?</p>

    <div class="menu">
      <a class="btn" href="Cumpleanos/index.html" style="background: linear-gradient(135deg, #ff4d8d, #c264fe); animation: pulse 1.8s ease-in-out infinite;">🎂 ¡Feliz Cumpleaños!</a>
      <a class="btn" href="Carta/index.html">💌 Carta de amor</a>
      <a class="btn" href="flores/index.html">🌼 Flores de septiembre aunque no te gusten</a>
      <a class="btn" href="Calma/index.html">💜 Recuerda lo mucho que vales como persona</a>
      <a class="btn" href="https://juan-bot.github.io/Sistema-Escolar/#/">📚 Sistema Escolar</a>
    </div>

    <footer>
      Hecho con mucho amor 💕
    </footer>
  </div>
</body>
</html>
